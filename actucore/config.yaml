# ActuCore — 执行模型层配置
#
# 与 perception/config.yaml 同构：mcp_port + 每张卡片的开关与参数。
# 所有卡片共用本配置；注册卡片不等于启动算法或取得执行权。

mcp_port: 15730

plugins:
  planar_navigation:
    enabled: true
    execution_enabled: false
    data_dir: /data/planar_navigation
  # 新增卡片后在这里打开它，例如：
  #
  # vla:
  #   enabled: true
  #   model_dir: /models/vla
  #   namespace: ""       # 留空则用 hostname 自动推导
  #
  # nav:
  #   enabled: true
  #   map_dir: /models/maps
  #
  # 卡片名要和 main.py 里 ActuCoreBundle 的注册块、以及插件的 PREFIX 对上。
