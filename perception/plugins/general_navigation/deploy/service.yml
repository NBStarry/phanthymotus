perception:
  image: __IMAGE__
  container_name: embodied-perception
  depends_on:
    - nav2
  network_mode: host
  read_only: false
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
    - /root/.ros:rw,nosuid,nodev,noexec,size=32m
  environment:
    - CONFIG_PATH=/config/general-navigation.yaml
    - AGENT_CORE_URL=https://localhost:15678
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    - PYTHONUNBUFFERED=1
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

nav2:
  image: phanthy-nav2:g1-humble-nav2card5
  container_name: phanthy-nav2-shadow
  network_mode: host
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m
    - /root/.ros:rw,nosuid,nodev,noexec,size=64m
  volumes:
    - /home/unitree/phanthy-nav2/maps:/maps
  group_add:
    - "1000"
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    - NAV2_MODE=mapping
    - NAV2_MAP_NAME=
    - NAV2_LIDAR_X=-0.00368
    - NAV2_LIDAR_Y=0.00003
    - NAV2_LIDAR_Z=0.46018
    - NAV2_LIDAR_ROLL=0.0
    - NAV2_LIDAR_PITCH=0.04014257279586953
    - NAV2_LIDAR_YAW=0.0
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  mem_limit: 6g
  cpus: 4.0
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "3"
  restart: unless-stopped
